name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check pages, manifest, folders, template, secrets, design standard, provenance (P1, P2)
        run: python3 tools/validate.py
      - name: Provenance public-rule tests (P1, P2, build rules, B7)
        run: python3 tools/test_provenance.py
      - name: Rule F2 (full mock before each real test; static check and check_f2.py on made-up fixtures)
        run: python3 tools/test_f2.py
      - name: Typed text only on SpellingBee pages (R13, fake pages, node)
        run: python3 tools/test_typed_text.py
      - name: SpellingBee typed-text drop (attack set and real misspellings, made-up data)
        run: node tools/test_spellguard.js
      - name: Retry loop (wrong-only rounds, locked questions, round logging, R14), headless Chrome, made-up fixture
        run: |
          pip install -q playwright
          python3 tools/test_retry_loop.py
      - name: Every 'Validated' trailer is true (validate.py passes at that commit)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tools/check_trailers.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            tools/check_trailers.sh "${{ github.event.before }}" "${{ github.sha }}"
          fi

  publish-e2e:
    # Runs tools/publish.sh end to end in a throwaway worktree with a dummy password and a sample page:
    # a good page must commit (with the trailer); purple, broken-link, no-provenance and B4 pages must be refused.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q cryptography
      - name: Shared checkout stays on main (R15, publish.sh branch guard, throwaway clone)
        run: tools/test_branch_guard.sh
      - name: Token-only rebuild exemption (made-up pages and tokens, throwaway git repo)
        run: python3 tools/test_token_only.py
      - name: publish.sh end-to-end test
        run: tools/test_publish.sh
