name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check pages, manifest, folders, template, secrets, design standard
        run: python3 tools/validate.py
      - name: Every 'Validated' trailer is true (validate.py passes at that commit)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tools/check_trailers.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            tools/check_trailers.sh "${{ github.event.before }}" "${{ github.sha }}"
          fi

  publish-e2e:
    # Runs tools/publish.sh end to end in a throwaway worktree with a dummy password and a sample page:
    # a good page must commit (with the trailer); a purple page and a broken-link page must be refused.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q cryptography
      - name: publish.sh end-to-end test
        run: tools/test_publish.sh
